<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Технологии кафедры ИСиТ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", system-ui, sans-serif; }
    body { background: #0f1a2e; color: #e8eef8; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    /* Header */
    header { padding: clamp(16px, 2vw, 32px) clamp(20px, 3vw, 60px); background: linear-gradient(135deg, #13243e 0%, #0d1828 100%); border-bottom: 2px solid #0066cc; position: relative; overflow: hidden; }
    header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 0%, rgba(0,102,204,0.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(0,153,255,0.1) 0%, transparent 50%); pointer-events: none; }
    .header-content { max-width: 1600px; margin: 0 auto; display: flex; align-items: center; gap: clamp(16px, 2vw, 40px); flex-wrap: wrap; position: relative; z-index: 1; }
    .logo { width: clamp(50px, 6vw, 80px); height: clamp(50px, 6vw, 80px); background: linear-gradient(135deg, #0066cc, #0099ff); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: clamp(24px, 3vw, 36px); box-shadow: 0 8px 32px rgba(0,102,204,0.4); flex-shrink: 0; }
    .title-block { flex: 1; min-width: 200px; }
    h1 { font-size: clamp(1.6rem, 2.5vw, 2.8rem); font-weight: 700; line-height: 1.2; background: linear-gradient(90deg, #fff, #8ab4f8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { font-size: clamp(0.9rem, 1.2vw, 1.1rem); color: #8ab4f8; margin-top: 4px; font-weight: 400; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .badge { background: rgba(0,102,204,0.2); border: 1px solid #0066cc; color: #a8d0ff; padding: 6px 14px; border-radius: 20px; font-size: clamp(0.7rem, 0.9vw, 0.85rem); font-weight: 500; }
    
    /* Main content - grid of technology tags */
    main { flex: 1; padding: clamp(20px, 2.5vw, 40px) clamp(20px, 3vw, 60px); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: clamp(12px, 1.5vw, 20px); max-width: 1600px; margin: 0 auto; width: 100%; }
    
    /* Technology tag */
    .tag { background: linear-gradient(135deg, #1e3a5c 0%, #0f1a2e 100%); border: 2px solid #0066cc; border-radius: 16px; padding: 20px 16px; text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; min-height: 140px; }
    .tag::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #0066cc, #0099ff); opacity: 0; transition: opacity 0.3s; }
    .tag:hover { border-color: #0099ff; transform: translateY(-4px) scale(1.02); }
    .tag:hover::before { opacity: 1; }
    .tag:active { transform: translateY(-2px) scale(0.98); }
    .tag.focus { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
    .tag.focus::before { opacity: 1; }
    .tag-icon { width: 48px; height: 48px; background: rgba(0,102,204,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 28px; margin-top: -12px; }
    .tag-name { font-size: clamp(1rem, 1.5vw, 1.2rem); font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.3; }
    .tag-desc { font-size: clamp(0.7rem, 1vw, 0.85rem); color: #a8d0ff; line-height: 1.4; min-height: 36px; }
    
    /* Focus ring */
    .tag:focus { outline: 2px solid #0099ff; outline-offset: 4px; }
    .tag:focus-visible { outline: 2px solid #0099ff; outline-offset: 4px; }
    
    /* Footer */
    footer { padding: clamp(16px, 2vw, 24px); text-align: center; color: #5a7a9a; font-size: clamp(0.75rem, 0.9vw, 0.85rem); border-top: 1px solid #1e3a5c; background: #0d1828; }
    footer a { color: #0099ff; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    
    /* Large screens */
    @media (min-width: 1920px) { main { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; } }
    @media (min-width: 2560px) { main { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; } }
    @media (min-width: 3840px) { main { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo" aria-hidden="true">🐴</div>
      <div class="title-block">
        <h1>Технологии кафедры ИСиТ</h1>
        <p class="subtitle">Витебский государственный технологический университет</p>
        <div class="badges">
          <span class="badge">Бакалавриат 4 года</span>
          <span class="badge">Заочно 3.5 года</span>
          <span class="badge">Инженер-программист</span>
        </div>
      </div>
    </div>
  </header>

  <main role="list" aria-label="Технологии кафедры ИСиТ"></main>

  <footer>
    <p>Данные с <a href="https://isit.vstu.by/" target="_blank">isit.vstu.by</a> • 2026</p>
  </footer>

  <script>
    // Технологии с сайта isit.vstu.by
    const technologies = [
      { id: "web", name: "Web-разработка", desc: "Фронтенд, бэкенд, полные стеки", icon: "🌐" },
      { id: "dotnet", name: ".NET / C#", desc: "Энтерпрайз, десктоп, микросервисы", icon: "💜" },
      { id: "java", name: "Java / Spring", desc: "Высоконагруженные бэкенды", icon: "☕" },
      { id: "python", name: "Python / Data / AI", desc: "Data Science, ML, автоматизация", icon: "🐍" },
      { id: "database", name: "Базы данных", desc: "БД, Data Warehouse, BI", icon: "🗄️" },
      { id: "mobile", name: "Мобильная разработка", desc: "Android, кроссплатформенные приложения", icon: "📱" },
      { id: "security", name: "Кибербезопасность", desc: "Защита информации, сети", icon: "🔐" },
      { id: "embedded", name: "Встраиваемые системы", desc: "ПЛК, SCADA, IoT, роботы", icon: "⚙️" },
      { id: "uiux", name: "UI/UX и графика", desc: "Интерфейсы, дизайн, мультимедиа", icon: "🎨" }
    ];

    // Рендер тегов
    const main = document.querySelector('main');
    main.innerHTML = technologies.map(t => `
      <article class="tag" data-id="${t.id}" role="button" tabindex="0" aria-label="${t.name}">
        <div class="tag-icon">${t.icon}</div>
        <div class="tag-name">${t.name}</div>
        <div class="tag-desc">${t.desc}</div>
      </article>
    `).join('');

    // Интерактивность
    const tags = main.querySelectorAll('.tag');
    
    tags.forEach(tag => {
      // Клик
      tag.addEventListener('click', () => {
        // Удаляем focus у всех, добавляем нажатому
        tags.forEach(t => t.classList.remove('focus'));
        tag.classList.add('focus');
        
        // Простая реакция на клик (можно заменить на ссылку или модалку)
        const name = tag.querySelector('.tag-name').textContent;
        // window.location.href = `https://github.com/isit-vstu/${t.id}`;
      });
      
      // Клавиатура
      tag.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          tags.forEach(t => t.classList.remove('focus'));
          tag.classList.add('focus');
        }
      });
      
      // Наведение
      tag.addEventListener('mouseover', () => {
        tag.classList.add('hover');
      });
      tag.addEventListener('mouseout', () => {
        tag.classList.remove('hover');
      });
    });
    
    // Автоматический фокус на первый тег при загрузке
    if (tags.length > 0) {
      tags[0].focus();
    }
  </script>
</body>
</html>
